[package]
name = "ams-dots-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "io-util", "sync", "process"] }
toml = "1.1.8"
